name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Rust 1.85 minimum
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install minimum Rust
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update
      - name: Test locked dependencies
        run: cargo +1.85.0 test --locked

  quality:
    name: Formatting and Clippy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update --component rustfmt --component clippy
      - name: Verify formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: Windows x64
            os: windows-2025
          - name: macOS Intel
            os: macos-15-intel
          - name: macOS ARM
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Build
        run: cargo build --locked --all-targets
      - name: Test
        run: cargo test --locked
